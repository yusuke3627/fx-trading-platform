[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fx-trading-platform"
version = "0.1.0"
description = "FX algorithmic trading platform (modular monolith, MT5 execution, USD/JPY first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # BOE はイールドカーブ推計を zip 入り Excel でしか配布しない（CSV 経路
    # 無し）。macro collector が読むために要る。
    "openpyxl>=3.1",
    # zoneinfo("America/New_York") for release-time conversion: Windows has no
    # system tz database.
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
llm = ["openai>=2.0"]
pdf = ["pypdf>=6.9.1"]
# pypdf は実行ホストの依存としては pdf extra 側が正本。dev にも入れるのは、
# 入っていないと PDF 抽出のテストが importorskip で丸ごと飛び、pypdf の API 変更や
# 壊れた PDF の扱いの退行が CI を素通りするため。
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "lefthook>=1.7", "pypdf>=6.9.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
