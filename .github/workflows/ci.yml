name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TRADING_DB_DSN: postgresql://postgres:postgres@localhost:5432/trading_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d trading_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install dependencies
        run: pip install -e '.[dev,db]'

      # Integration tests skip themselves when TRADING_DB_DSN is unset, and a
      # skipped suite is green. Connecting here first turns a broken DSN into a
      # failure instead of a silently empty run.
      - name: Verify the database is reachable
        run: python -c "import os, psycopg; psycopg.connect(os.environ['TRADING_DB_DSN']).close()"

      - name: Run integration tests
        run: pytest tests/integration -q
