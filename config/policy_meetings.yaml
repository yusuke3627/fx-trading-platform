# 公式カレンダーどおりの会合予定（恒久記録）。リスク窓はこのセクションだけ
# から構築され、採点には乗らない（結果未公表の会合を meetings: に置くと、
# 日次 collector が 0 点イベントを決定的 id で永続化し、後から訂正できない）。
#
# statement 公表後は実結果を meetings: へ「追加」する。ここのエントリは
# 消さない — 事前に市場が知っていたのは予定区間であり、窓は転記後もそれに
# 掛かり続ける（実公表時刻で窓を作り直すと replay が当時未知の情報を使う）。
# 公表期限を過ぎて meetings: に対応エントリが無い場合、日次 collector は
# 失敗して転記漏れを知らせる。結果フィールドをここに書き足しても拒否される。
#
# 公表時刻は点ではなく区間で持つ。窓は earliest 側から開き latest 側で閉じる。
# FED は 14:00 ET 固定なので両者同値。BOJ は時刻非固定のため、早い境界に
# 会合 2 日目の開始（9:00 JST。それより早い公表はあり得ない）、遅い境界に
# 保守置きの 15:00 JST を置く。
# バックフィルした過去会合も BOJ は区間を登録する（meetings: の保守置き一点
# だけだと窓が 9:00 JST 起点より 6 時間遅く開き、historical replay の
# HALT/REDUCED 判定がずれる）。FED は固定時刻＝meetings: の一点が予定区間
# そのものなので、過去分は schedule に重複登録しない（risk_windows.py が
# meetings: の一点から同じ窓を作る）。
# 日程の一次資料: FED は FRB 公式カレンダー、BOJ は各年の
# 「金融政策決定会合等の日程」PDF（2024年分 mref230728a / 2025年分
# mref240731a / 2026年分 mref250731a）。8 月は両行とも会合なし。
