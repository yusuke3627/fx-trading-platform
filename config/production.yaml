# Production: capital scaling only after edge is verified through
# backtest -> out-of-sample -> walk-forward -> shadow -> micro live.
# Limits are raised deliberately per strategy, never by default.
risk:
  trading_enabled: true
  max_open_positions_per_symbol: 1
  # 多ペア live を明示的に判断するまで、portfolio 全体でも従来どおり 1 本。
  max_open_positions_portfolio: 1
  max_units_per_symbol:
    USDJPY: 1000
  require_broker_stop_loss: true
