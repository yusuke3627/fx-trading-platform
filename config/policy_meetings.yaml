# 中央銀行会合ファクト（機械採点の入力）。
#
# - 1 会合 1 エントリ。値は公式 statement / 展望レポート・SEP から転記し、確認が
#   取れたら verified: true にする。人名は記録しない（dissent は人数のみ）。
# - statement_published_at が known_at になる。FOMC は 14:00 ET 固定（夏時間
#   18:00 UTC / 冬時間 19:00 UTC）。BOJ は時刻非固定のため、実際の公表時刻を
#   確認するまでは保守側の遅い時刻（15:00 JST = 06:00 UTC）を置く
#   （look-ahead 防止が優先。リスク窓の pre_hours=48 が実公表を確実に覆う）。
#
# 転記ルール（機械採点の再現性のため固定）:
# - dissent は「政策金利決定への反対」のみ数える。方向は反対者が選好した金利
#   （利上げ・据え置き=hawkish / 利下げ・より大幅な利下げ=dovish）で判定する。
#   QT・国債買入れ・声明文言・見通し別紙への反対は数えない。
# - inflation_forecast_change は見通し公表回（BOJ=展望レポート 1/4/7/10 月、
#   FED=SEP 3/6/9/12 月）のみ。当該年度（FED は当該暦年）のコア CPI / PCE
#   インフレ率の中央値を前回公表と比べ、上方修正 +1 / 不変 0 / 下方修正 -1。
# - explicit_future_hike_language は当日公表の声明本文のみで判定する（展望
#   レポート本文・SEP・総裁会見は見ない。BOJ の展望回声明は調節方針のみの
#   短文形式が多く、同趣旨の文言が基本的見解側にあっても false とする）。

# この暦が「網羅している」と主張する期間。登録済み会合の範囲ではなく、ここに
# 載っていない会合が無いと言い切れる範囲を書く。この外側では Risk はイベント
# モードを設定の既定値（保守側）で扱う。
