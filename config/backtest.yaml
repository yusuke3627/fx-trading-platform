# Backtest: replay clock, execution simulator, no broker.
# trading_enabled は Risk Engine のゲートなので backtest では有効にする。
# 実 Broker への到達は設定ではなく配線で遮断される（backtest では
# ExecutionAdapter を組み込まず Simulator のみが注文を受ける）。
risk:
  trading_enabled: true
  # 戦略のエッジ測定を運用開始用の損失上限で打ち切らないため、研究では緩和する。
  # 100.00 は無効化の便宜値であり、正の基準資産に対して資産がゼロ以下なら拒否する。
  daily_loss_halt_pct: 100.00
  rolling_24h_loss_halt_pct: 100.00
  high_water_mark_drawdown_halt_pct: 100.00

simulator:
  scenario: normal
  seed: 42

strategies:
  failed_spike_reversal:
    enabled: true
  post_event_failed_breakout:
    enabled: true
  monetary_policy_convergence:
    enabled: true
