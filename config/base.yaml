# Shared configuration. Environment overlays (backtest/demo/shadow/
# micro_live/production) merge on top of this file.

broker:
  expected_account_mode: HEDGING
  magic_number: 260813
  deviation_points: 10

market:
  primary_instruments: [USDJPY]
  # 口座通貨(JPY)換算に使う broker symbol（取引銘柄と独立に spec を解決する）
  conversion_instruments: [USDJPY]
  quote_max_age_seconds: 5
  tick_poll_interval_seconds: 0.2
  broker_server_ahead_of_ny_hours: 7

storage:
  dsn_env: TRADING_DB_DSN

# Beginner upper bounds for entering micro live; never a backtest
# optimization target. Percentages are in percent (0.05 = 0.05%).
# platform 対応（収集・shadow 評価の対象）と live 発注許可の分離（ADR-012）。
# ここに載っていない symbol は発注不可（fail-close）。
instruments:
  USDJPY:
    platform_enabled: true
    trading_enabled: true
  EURUSD:
    platform_enabled: true
    trading_enabled: false
  GBPUSD:
    platform_enabled: true
    trading_enabled: false
  GBPJPY:
    platform_enabled: true
    trading_enabled: false

risk:
  trading_enabled: false

  max_open_positions_per_symbol: 1
  max_open_positions_portfolio: 3
  # platform 対応の全ペアに定義する（欠けた symbol は SYMBOL_LIMIT_CONFIGURED
  # で発注不可のため、trading_enabled の昇格だけでは取引できない）。値は
  # USDJPY と同じ最小構成で置き、各ペアの昇格 Gate で見直す。
  max_units_per_symbol:
    USDJPY: 1000
    EURUSD: 1000
    GBPUSD: 1000
    GBPJPY: 1000

  max_risk_per_trade_pct: 0.05
  # portfolio 全体の open stop-risk 予算と通貨別 net exposure 上限（equity 比
  # %）。どちらも Monte Carlo / demo で校正するまでの保守的な仮置き。
  portfolio_stop_risk_budget_pct: 0.10
  max_currency_net_exposure_pct: 300

  daily_loss_halt_pct: 0.75
  rolling_24h_loss_halt_pct: 1.00
  high_water_mark_drawdown_halt_pct: 3.00

  # USDJPY は従来値を維持。他ペアは保守的な仮置きで、各ペアの昇格 Gate で校正する。
  absolute_max_spread_pips:
    USDJPY: 2.0
    EURUSD: 2.0
    GBPUSD: 2.5
    GBPJPY: 4.0
  quote_max_age_seconds: 5
  min_margin_level_pct: 300

  require_broker_stop_loss: true

  halt_on_unknown_order: true
  halt_on_position_mismatch: true
  halt_on_untracked_fill: true

  event_mode_default: REDUCED

arbitrator:
  # 同時 signal の裁定係数（設計書 v2.1 §26 Step 7、ADR-029）。backtest で校正して
  # 固定する値で、LLM や runtime から変更しない。現在値は校正前の仮置き。
  # 既存 book と同方向の通貨 leg 1 本あたり、priority（edge_r × confidence）から引く量。
  existing_exposure_penalty_r: 0.10
  # triangle（GBPJPY ≒ GBPUSD × USDJPY）を構成する 3 ペアのうち同時に保有してよい
  # pair 数。2 = 三辺を同時には持たない。
  max_pairs_per_triangle: 2

event_risk:
  dual_central_bank_cluster:
    pre_hours: 48
    post_hours: 24
    scalp: HALT
    intraday: REDUCED
    swing: REDUCED

intelligence:
  llm_enabled: false
  intervention_risk:
    version: "2026.08.0"
    weights:
      official_wording_score: 0.25
      realized_volatility: 0.20
      distance_from_intervention_zone: 0.20
      days_since_intervention: 0.15
      verification_state: 0.10
      rate_of_change: 0.10

simulator:
  scenario: normal
  seed: 42
  latency_ms: 150

session_profiles:
  usdjpy_core:
    tokyo: ALLOWED
    london: ALLOWED
    new_york: PREFERRED
  london_ny_major:
    tokyo: DISABLED
    london: PREFERRED
    new_york: PREFERRED
  gbpjpy_cross:
    tokyo: SHADOW_ONLY
    london: PREFERRED
    new_york: ALLOWED
  usdjpy_scalp_research:
    tokyo: SHADOW_ONLY
    london: SHADOW_ONLY
    new_york: SHADOW_ONLY

strategies:
  failed_spike_reversal:
    enabled: false
    status: RESEARCH_ONLY
    instruments: [USDJPY]
    timeframes:
      entry: 1m
    parameters:
      defaults:
        spike_atr_multiple: 3.0
        spike_window_seconds: 60
        atr_period: 14
        stop_buffer_atr: 0.5
        long_side_enabled: false
        expected_horizon_seconds: 300
        spread_gate:
          max_spread_to_atr: "0.5"
      instruments:
        USDJPY:
          absolute_max_spread_pips: "1.5"
          session_profile: usdjpy_scalp_research

  post_event_failed_breakout:
    enabled: false
    status: RESEARCH_ONLY
    instruments: [USDJPY]
    timeframes:
      regime: 1h
      setup: 15m
      entry: 5m
    parameters:
      resistance_lookback: 20
      atr_period: 14
      stop_buffer_atr: 0.5
      macro_gate_threshold: 0.0
      intervention_risk_max_for_long: 0.5
      expected_horizon_seconds: 21600

  monetary_policy_convergence:
    enabled: false
    status: RESEARCH_ONLY
    instruments: [USDJPY]
    timeframes:
      trigger: 4h
      trend: 1d
    parameters:
      defaults:
        swing_left: 2
        swing_right: 2
        support_lookback: 30
        atr_period: 14
        stop_buffer_atr: 1.0
        intervention_risk_min_for_short: 0.2
        expected_horizon_seconds: 432000
      instruments:
        USDJPY:
          session_profile: usdjpy_core
