    verified: false
    source_uri: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm

  - bank: BOJ
    decision_date: 2026-10-30
    statement_published_at: 2026-10-30T06:00:00+00:00  # 15:00 JST（保守置き・展望レポート回）
    verified: false
    source_uri: https://www.boj.or.jp/mopo/mpmsche_minu/m_ref/mref250731a.pdf

  - bank: FED
    decision_date: 2026-12-09
